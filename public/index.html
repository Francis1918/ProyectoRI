<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lente · Buscador de FiQA</title>
  <meta name="description" content="Lente compara cuatro modelos de recuperación de información (Jaccard, TF-IDF, BM25 y búsqueda semántica) sobre el corpus financiero FiQA.">
  <meta name="theme-color" content="#0d1030">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/fraunces-300-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/lente.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body data-view="home">
  <a class="skip" href="#main">Saltar al contenido</a>
  <div class="scene" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="#/" aria-label="Lente, inicio">Lente</a>

    <form class="searchbar" id="search-form" role="search" autocomplete="off" novalidate>
      <button class="searchbar-submit" type="submit" aria-label="Buscar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      </button>
      <label class="visually-hidden" for="q">Consulta en FiQA</label>
      <input id="q" name="q" type="search" placeholder="Busca en FiQA" maxlength="300" enterkeyhint="search" spellcheck="false">

      <div class="method" id="method">
        <button class="method-button" id="method-button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="method-list" aria-label="Modelo de recuperación">
          <span id="method-label">Semántico</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <ul class="method-list" id="method-list" role="listbox" tabindex="-1" aria-label="Modelo de recuperación" hidden></ul>
      </div>
    </form>

    <nav class="top-nav" aria-label="Principal">
      <a href="#/evaluacion" id="nav-eval">Evaluación FiQA</a>
    </nav>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="foot">
    <p class="foot-corpus" id="foot-corpus">Corpus FiQA · 57 638 documentos</p>
    <p class="foot-credit">Foto: <a href="https://commons.wikimedia.org/wiki/File:Crazy_Mountains,_Montana_(31907528007).jpg" rel="noopener">Crazy Mountains, Montana</a>, Janusz Sobolewski, <a href="https://creativecommons.org/licenses/by/2.0/" rel="noopener">CC BY 2.0</a>; recortada y con color ajustado.</p>
  </footer>

  <div class="visually-hidden" id="status" role="status" aria-live="polite"></div>
  <dialog class="doc-dialog" id="doc-dialog" aria-labelledby="doc-dialog-title"></dialog>

  <noscript><p class="noscript">Lente necesita JavaScript para consultar la API de búsqueda.</p></noscript>
</body>
</html>
